<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="portrait">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7a0c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tigrinho da Sorte</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ===== Arte original em SVG ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <linearGradient id="gOr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb43a"/><stop offset="1" stop-color="#f27a12"/></linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#ffc83a"/><stop offset="1" stop-color="#c8860a"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a4a"/><stop offset="1" stop-color="#b8101c"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e6bd8"/><stop offset="1" stop-color="#4a2c94"/></linearGradient>
  <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7aa2ff"/><stop offset="1" stop-color="#2f4fc0"/></linearGradient>
  <radialGradient id="gOrange" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffc34d"/><stop offset="1" stop-color="#ee6a0a"/></radialGradient>

  <symbol id="s-tiger" viewBox="0 0 100 100">
    <circle cx="20" cy="26" r="14" fill="url(#gOr)"/><circle cx="20" cy="26" r="7" fill="#ffb3a0"/>
    <circle cx="80" cy="26" r="14" fill="url(#gOr)"/><circle cx="80" cy="26" r="7" fill="#ffb3a0"/>
    <ellipse cx="50" cy="55" rx="42" ry="38" fill="url(#gOr)" stroke="#a84a05" stroke-width="2"/>
    <ellipse cx="50" cy="38" rx="26" ry="12" fill="#fff" opacity=".18"/>
    <g fill="#5a2a05" stroke="#5a2a05" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 18 L45 36 L50 31 L55 36Z"/><path d="M34 21 L36 35 L41 28Z"/><path d="M66 21 L64 35 L59 28Z"/>
    <path d="M10 52 L25 56 L11 61Z"/><path d="M12 68 L26 66 L16 76Z"/><path d="M90 52 L75 56 L89 61Z"/><path d="M88 68 L74 66 L84 76Z"/></g>
    <ellipse cx="50" cy="70" rx="23" ry="17" fill="#fff4dc"/>
    <ellipse cx="36" cy="46" rx="7" ry="4.5" fill="none" stroke="#3b1a00" stroke-width="4" stroke-linecap="round" class="eye"/>
    <ellipse cx="64" cy="46" rx="7" ry="4.5" fill="none" stroke="#3b1a00" stroke-width="4" stroke-linecap="round" class="eye"/>
    <circle cx="38.5" cy="44.5" r="1.8" fill="#fff" opacity=".9" class="eye"/>
    <circle cx="66.5" cy="44.5" r="1.8" fill="#fff" opacity=".9" class="eye"/>
    <circle cx="26" cy="63" r="6" fill="#ff7a7a" opacity=".55"/><circle cx="74" cy="63" r="6" fill="#ff7a7a" opacity=".55"/>
    <path d="M44 61 Q50 58 56 61 Q50 69 44 61Z" fill="#e0475a" stroke="#7a1a2a" stroke-width="1.5"/>
    <ellipse cx="47.5" cy="60" rx="2.4" ry="1.2" fill="#fff" opacity=".6"/>
    <path d="M50 66 L50 71 M50 71 Q44 77 38 72 M50 71 Q56 77 62 72" stroke="#3b1a00" stroke-width="2.5" fill="none" stroke-linecap="round" class="mouth-closed"/>
    <path d="M38 72 Q50 92 62 72Z" fill="#8a1220" stroke="#3b1a00" stroke-width="2" class="mouth-open"/>
    <path d="M44 80 Q50 86 56 80 Q50 76 44 80Z" fill="#ff7a8a" class="mouth-open"/>
    <path d="M30 14 Q50 -4 70 14 L66 22 Q50 12 34 22Z" fill="url(#gRed)" stroke="#ffd84a" stroke-width="2"/>
    <circle cx="50" cy="8" r="5" fill="url(#gGold)"/>
  </symbol>

  <symbol id="s-wild" viewBox="0 0 100 100">
    <use href="#s-tiger" x="8" y="-4" width="84" height="84"/>
    <rect x="6" y="70" width="88" height="24" rx="8" fill="url(#gRed)" stroke="url(#gGold)" stroke-width="3"/>
    <text x="50" y="88" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="20" fill="#ffe680" stroke="#5a0610" stroke-width="1.2" paint-order="stroke">WILD</text>
  </symbol>

  <symbol id="s-envelope" viewBox="0 0 100 100">
    <g transform="rotate(-12 50 50)"><rect x="24" y="14" width="52" height="74" rx="6" fill="url(#gRed)" stroke="url(#gGold)" stroke-width="3"/>
    <path d="M24 34 Q50 58 76 34" fill="none" stroke="url(#gGold)" stroke-width="3"/>
    <circle cx="50" cy="52" r="15" fill="url(#gGold)" stroke="#a86a00" stroke-width="2"/><rect x="44" y="46" width="12" height="12" fill="#b8101c"/></g>
  </symbol>

  <symbol id="s-ingot" viewBox="0 0 100 100">
    <path d="M8 38 Q50 58 92 38 L80 74 Q50 88 20 74Z" fill="url(#gGold)" stroke="#a86a00" stroke-width="3"/>
    <ellipse cx="50" cy="36" rx="42" ry="16" fill="#ffe27a" stroke="#a86a00" stroke-width="3"/>
    <ellipse cx="50" cy="35" rx="26" ry="9" fill="#e09a14"/>
    <path d="M32 24 Q50 4 68 24 Q50 32 32 24Z" fill="url(#gGold)" stroke="#a86a00" stroke-width="2.5"/>
  </symbol>

  <symbol id="s-bag" viewBox="0 0 100 100">
    <path d="M30 24 Q50 34 70 24 L66 14 Q50 22 34 14Z" fill="url(#gPurple)" stroke="#2a1560" stroke-width="2"/>
    <path d="M32 28 Q6 56 14 80 Q50 98 86 80 Q94 56 68 28 Q50 38 32 28Z" fill="url(#gRed)" stroke="url(#gGold)" stroke-width="3"/>
    <circle cx="50" cy="62" r="17" fill="url(#gGold)" stroke="#a86a00" stroke-width="2"/>
    <text x="50" y="70" text-anchor="middle" font-size="22" font-weight="bold" fill="#b8101c" font-family="serif">福</text>
    <circle cx="36" cy="18" r="7" fill="url(#gGold)"/><circle cx="52" cy="14" r="7" fill="url(#gGold)"/><circle cx="66" cy="18" r="7" fill="url(#gGold)"/>
  </symbol>

  <symbol id="s-orange" viewBox="0 0 100 100">
    <circle cx="50" cy="56" r="36" fill="url(#gOrange)" stroke="#b04a00" stroke-width="2.5"/>
    <ellipse cx="38" cy="42" rx="9" ry="6" fill="#fff" opacity=".35" transform="rotate(-30 38 42)"/>
    <path d="M50 22 Q60 6 78 12 Q70 28 50 24Z" fill="#3fa84a" stroke="#1f6a2a" stroke-width="2"/>
    <path d="M50 22 L50 16" stroke="#5a3a10" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <symbol id="s-cracker" viewBox="0 0 100 100">
    <g transform="rotate(-14 50 50)"><rect x="22" y="22" width="20" height="62" rx="4" fill="url(#gBlue)" stroke="#1c2f80" stroke-width="2"/>
    <rect x="46" y="18" width="20" height="62" rx="4" fill="url(#gBlue)" stroke="#1c2f80" stroke-width="2"/>
    <rect x="70" y="26" width="18" height="56" rx="4" fill="url(#gBlue)" stroke="#1c2f80" stroke-width="2"/>
    <rect x="22" y="30" width="20" height="6" fill="url(#gGold)"/><rect x="46" y="26" width="20" height="6" fill="url(#gGold)"/><rect x="70" y="34" width="18" height="6" fill="url(#gGold)"/>
    <path d="M10 56 H92" stroke="#d8182a" stroke-width="5"/><path d="M52 56 Q46 78 54 90" stroke="#d8182a" stroke-width="4" fill="none"/><circle cx="54" cy="91" r="4" fill="#d8182a"/></g>
  </symbol>

  <symbol id="s-lantern" viewBox="0 0 100 100">
    <path d="M50 4 V16" stroke="#7a4a10" stroke-width="3"/>
    <rect x="34" y="14" width="32" height="9" rx="3" fill="url(#gGold)"/>
    <ellipse cx="50" cy="50" rx="36" ry="30" fill="url(#gRed)" stroke="#8a0c16" stroke-width="2.5"/>
    <path d="M50 20 Q30 50 50 80 M50 20 Q70 50 50 80 M24 38 Q50 50 76 38 M24 62 Q50 50 76 62" stroke="#ffd84a" stroke-width="2" fill="none" opacity=".75"/>
    <rect x="34" y="78" width="32" height="9" rx="3" fill="url(#gGold)"/>
    <path d="M50 87 V98 M44 87 V96 M56 87 V96" stroke="#ffc83a" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <!-- mascote de corpo inteiro -->
  <symbol id="s-mascot" viewBox="0 0 160 190">
    <ellipse cx="80" cy="180" rx="50" ry="8" fill="#000" opacity=".25"/>
    <path d="M118 140 Q158 130 148 96 Q142 84 134 96" fill="none" stroke="#f27a12" stroke-width="12" stroke-linecap="round" class="tail"/>
    <ellipse cx="58" cy="168" rx="20" ry="12" fill="url(#gOr)" stroke="#a84a05" stroke-width="2"/>
    <ellipse cx="102" cy="168" rx="20" ry="12" fill="url(#gOr)" stroke="#a84a05" stroke-width="2"/>
    <path d="M32 100 Q30 160 80 164 Q130 160 128 100 Q80 86 32 100Z" fill="url(#gRed)" stroke="url(#gGold)" stroke-width="3"/>
    <ellipse cx="80" cy="140" rx="30" ry="22" fill="#fff4dc" opacity=".9"/>
    <path d="M60 120 L100 160 M100 120 L60 160" stroke="url(#gGold)" stroke-width="2" opacity="0"/>
    <circle cx="80" cy="132" r="14" fill="url(#gGold)" stroke="#a86a00" stroke-width="2"/><text x="80" y="139" text-anchor="middle" font-size="18" font-weight="bold" fill="#b8101c" font-family="serif">福</text>
    <g class="arm-l"><ellipse cx="30" cy="120" rx="12" ry="22" fill="url(#gOr)" stroke="#a84a05" stroke-width="2" transform="rotate(18 30 120)"/></g>
    <g class="arm-r"><ellipse cx="130" cy="120" rx="12" ry="22" fill="url(#gOr)" stroke="#a84a05" stroke-width="2" transform="rotate(-18 130 120)"/>
      <g transform="translate(128 96) rotate(14)"><rect x="-10" y="-16" width="22" height="30" rx="3" fill="url(#gRed)" stroke="url(#gGold)" stroke-width="2"/><circle cx="1" cy="0" r="6" fill="url(#gGold)"/></g></g>
    <use href="#s-tiger" x="14" y="2" width="132" height="132"/>
  </symbol>

  <symbol id="s-coin" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="url(#gGold)" stroke="#a86a00" stroke-width="5"/><circle cx="50" cy="50" r="34" fill="none" stroke="#c8860a" stroke-width="3"/>
    <rect x="40" y="40" width="20" height="20" fill="#a86a00" opacity=".85"/>
  </symbol>
</defs>
</svg>

<canvas id="fx"></canvas>

<div id="boot" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#s-tiger"/></svg><p>A preparar o tigre…</p></div>
<div id="rotateHint" hidden>🔄 Vire o telemóvel para <b>retrato</b> para a melhor experiência</div>

<div id="app" data-theme="red" data-orient="portrait">
  <div class="lanterns"><i></i><i></i><i></i></div>

  <header class="top">
    <button id="btnMenu" class="icon" aria-label="Menu">☰</button>
    <div class="levelbox"><b>Nv <span id="lvl">1</span></b><div class="xp"><i id="xpbar"></i></div></div>
    <button id="btnSound" class="icon" aria-label="Ativar/desativar som">🔊</button>
    <div class="chips"><svg><use href="#s-coin"/></svg><span id="balance">0</span></div>
  </header>

  <section class="stage">
    <div class="mrow">
      <svg class="mascot idle" id="mascot" viewBox="0 0 160 190"><use href="#s-mascot"/></svg>
      <div class="bubble" id="bubble">Vamos girar!</div>
    </div>
    <div class="machine" id="machine">
      <div class="frame">
        <div class="reels" id="reels"></div>
        <div class="linefx" id="linefx"></div>
      </div>
      <div class="winbar" id="winbar"><span id="winlabel">Última vitória</span><b id="winamt">0</b></div>
    </div>
  </section>

  <section class="controls">
    <button id="betDown" class="round small" aria-label="Diminuir aposta">−</button>
    <div class="betbox"><small>APOSTA</small><b id="bet">10</b></div>
    <button id="betUp" class="round small" aria-label="Aumentar aposta">+</button>
    <button id="spin" class="spin" aria-label="Girar"><span>GIRAR</span></button>
    <button id="auto" class="round small toggle" aria-label="Giro automático">AUTO</button>
    <button id="turbo" class="round small toggle" aria-label="Turbo">⚡</button>
  </section>
  <footer class="legal">Jogo de entretenimento • Fichas fictícias, sem valor real, sem depósito e sem saque • +18</footer>

  <div class="toast" id="toast"></div>

  <!-- Vitória grande -->
  <div class="overlay" id="bigwin" hidden>
    <div class="bw-title" id="bwTitle">GRANDE VITÓRIA</div>
    <div class="bw-amt"><svg><use href="#s-coin"/></svg><b id="bwAmt">0</b></div>
    <small>toque para continuar</small>
  </div>

  <!-- Modal genérico -->
  <div class="overlay modal" id="modal" hidden><div class="card" id="modalCard"></div></div>
</div>
<script src="engine.js"></script>
<script src="config.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
